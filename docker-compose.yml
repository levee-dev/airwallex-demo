services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - acme-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acme -d acme']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acme-db:
